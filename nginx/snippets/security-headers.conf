# Har bir location ichida include qilinadi (location'dagi add_header server darajasidagilarni bekor qiladi).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Kamera va mikrofon faqat o'z saytimizga; qolgan sensorlar yopiq.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

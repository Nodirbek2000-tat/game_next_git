# uzbekyoshlari.uz — nginx (reverse proxy). Konteyner nomlari `web` tarmog'ida:
#   harakat-next:3000   (frontend stack)
#   harakat-django:8000 (backend stack)
# Variable orqali proxy_pass: stacklardan biri o'chiq bo'lsa ham nginx ishga tushaveradi (502 qaytaradi).

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker ichki DNS

server_tokens off;
client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# So'rovlar tezligini cheklash (brute-force / skraping oldini olish)
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
limit_req_status 429;

# Siqish. Brotli rasmiy nginx image'da yo'q — gzip yetarli (Next.js o'zi ham siqadi).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/manifest+json
    application/wasm image/svg+xml font/ttf font/otf;

# --- Noma'lum host (IP orqali yoki boshqa domen) — javobsiz uziladi ---
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

# --- HTTP: ACME challenge + HTTPS'ga yo'naltirish ---
server {
    listen 80;
    server_name uzbekyoshlari.uz www.uzbekyoshlari.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://uzbekyoshlari.uz$request_uri;
    }
}

# --- HTTPS: www -> asosiy domen ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.uzbekyoshlari.uz;

    include snippets/ssl.conf;
    return 301 https://uzbekyoshlari.uz$request_uri;
}

# --- HTTPS: asosiy sayt ---
server {
    listen 443 ssl;
    http2 on;
    server_name uzbekyoshlari.uz;

    include snippets/ssl.conf;

    set $next_upstream   http://harakat-next:3000;
    set $django_upstream http://harakat-django:8000;

    # ---- Django ----
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy-django.conf;
    }

    location ^~ /admin/ {
        limit_req zone=admin burst=10 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy-django.conf;
    }

    # Django statik fayllari (WhiteNoise hash'li nom bilan beradi — 1 yil kesh)
    location ^~ /static/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_hide_header Cache-Control;
        include snippets/proxy-django.conf;
    }

    # ---- Next.js: hash'li fayllar ----
    location ^~ /_next/static/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_hide_header Cache-Control;
        include snippets/proxy-next.conf;
    }

    # ---- Next.js: hash'siz katta resurslar (MediaPipe wasm/model, 3D) — 30 kun ----
    # Content-Type'ni Next beradi (.wasm -> application/wasm, next.config.ts'da qat'iy belgilangan).
    location ^~ /models/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        proxy_hide_header Cache-Control;
        include snippets/proxy-next.conf;
    }

    location ^~ /mediapipe/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        proxy_hide_header Cache-Control;
        include snippets/proxy-next.conf;
    }

    location ~* \.(glb|gltf|ktx2|wasm|task|hdr|woff2)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        proxy_hide_header Cache-Control;
        include snippets/proxy-next.conf;
    }

    # ---- Next.js: sahifalar (SSR). Streaming uchun buferlash o'chiq ----
    location / {
        include snippets/security-headers.conf;
        proxy_buffering off;
        include snippets/proxy-next.conf;
    }
}

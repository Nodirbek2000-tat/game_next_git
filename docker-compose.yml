# FRONTEND: Next.js + nginx + certbot (uzbekyoshlari.uz, avtomatik SSL).
# Backend repo (game_git) dan mustaqil deploy qilinadi; ikkalasi tashqi `web` tarmog'i orqali bog'lanadi:
#   docker network create web     (serverda bir marta)
# Internetga faqat nginx 80/443 ochiq. Faqat Next'ni yangilash: docker compose up -d --build next
name: harakat-frontend

services:
  next:
    build:
      context: .
      args:
        # Build vaqtida kodga yoziladi (o'zgarsa qayta build qiling)
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?.env da NEXT_PUBLIC_SITE_URL ni belgilang}
    image: harakat/next:latest
    container_name: harakat-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [web]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.28-alpine
    container_name: harakat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
    # Har 6 soatda config/sertifikatni qayta o'qiydi (certbot yangilagan sertifikat kuchga kirishi uchun).
    # Docker socket kerak emas.
    command:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 21600; nginx -t -q && nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Sertifikat yangilash sikli (har 12 soatda tekshiradi; muddati 30 kundan kam qolsa yangilaydi).
  certbot:
    image: certbot/certbot:v3.3.0
    container_name: harakat-certbot
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 43200 & wait $${!}
        done
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    networks: [web]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  web:
    external: true
    name: web
